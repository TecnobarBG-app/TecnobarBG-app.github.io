/* Industry — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap');

:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f5f5f8;
  --color-neutral-200: #e7e7ea;
  --color-neutral-300: #d4d4d7;
  --color-neutral-400: #b7b7ba;
  --color-neutral-500: #98989b;
  --color-neutral-600: #7a7a7d;
  --color-neutral-700: #5d5d60;
  --color-neutral-800: #424244;
  --color-neutral-900: #2b2b2d;

  --color-accent-100: #eef6ff;
  --color-accent-200: #d6ebff;
  --color-accent-300: #b5d9fd;
  --color-accent-400: #94bce3;
  --color-accent-500: #749dc4;
  --color-accent-600: #597ea3;
  --color-accent-700: #416180;
  --color-accent-800: #2c455d;
  --color-accent-900: #1d2d3d;

  --color-accent-2-100: #eef6ff;
  --color-accent-2-200: #d6ebff;
  --color-accent-2-300: #bdd8f2;
  --color-accent-2-400: #9ebbd8;
  --color-accent-2-500: #7e9cb8;
  --color-accent-2-600: #627d98;
  --color-accent-2-700: #486077;
  --color-accent-2-800: #314457;
  --color-accent-2-900: #1f2d3a;

  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, sans-serif;

  --space-1: 3.4px;
  --space-2: 6.8px;
  --space-3: 10.2px;
  --space-4: 13.6px;
  --space-6: 20.4px;
  --space-8: 27.2px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 7px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.blueprint {
  position: relative;
  border: 1px solid var(--color-divider);
  border-radius: 0;
}
/* The overlay image treatments (halftone, duotone) clip their overlay
   (overflow:hidden); a blueprint wrapper draws its registration marks
   outside the box, so when both classes share a wrapper the frame must
   win. */
.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }
.blueprint > .corner {
  position: absolute; width: 11px; height: 11px;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.blueprint > .corner::before, .blueprint > .corner::after {
  content: ""; position: absolute; background: currentColor;
}
.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
.blueprint > .corner.tl { top: -6px; left: -6px; }
.blueprint > .corner.tr { top: -6px; right: -6px; }
.blueprint > .corner.bl { bottom: -6px; left: -6px; }
.blueprint > .corner.br { bottom: -6px; right: -6px; }

.duotone{position:relative;overflow:hidden}
.duotone::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--color-accent);mix-blend-mode:color}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* — blueprint frame: components are wireframe objects (see .blueprint
     and .corner above) — square, transparent, hairline-bordered — */
.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }
.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }
.btn { border: 1px solid var(--color-divider); }
.btn-primary { border-color: var(--color-accent); }
.btn-ghost { border-color: transparent; }


</style>

let _bozzaT = null;

// copia della bozza nel registro (senza anteprime delle foto e senza firma, che pesano troppo)
let _bozzaS = null;

// Bozze: più rapportini non inviati insieme, ognuno con il suo uid. Non bloccano mai un rapportino nuovo.
function bozzeLocali() {
  const t = store.get(K_BOZZE) || {};
  const vecchia = store.get(K_DRAFT);                     // bozza singola delle versioni precedenti
  if (vecchia && vecchia.uid && !t[vecchia.uid]) { t[vecchia.uid] = vecchia; store.set(K_BOZZE, t); }

// bozza "vuota": iniziata e lasciata subito, senza niente di utile dentro
function bozzaVuota(d) {

  return !(d.cliente || (d.pezzi && d.pezzi.length) || String(d.lavoro || '').trim() || d.oTipo || String(d.oMarca || '').trim() ||
    d.minutes || app || (d.photos && Object.keys(d.photos).length) || d.torref || d.oTorref);
}
function elencoBozze() {
  const t = bozzeLocali();
  Object.keys(t).forEach(k => { if (bozzaVuota(t[k])) { delete t[k]; eliminaBozzaServer(k); } });
  store.set(K_BOZZE, t);
  // sul tablet di officina ognuno vede solo le sue bozze
  return Object.values(t).filter(d => !(AUTH && AUTH.tablet) || !d.tec || d.tec === AUTH.tecnico).sort((a, b) => (b.agg || 0) - (a.agg || 0));
}
function eliminaBozzaServer(id) { if (AUTH && AUTH.pin && id) run('appSalvaBozza', AUTH.pin, AUTH.tecnico, '', id).catch(() => { }); }
function eliminaBozza(id) {
  segnaInviato(id);                      // eliminata: non va più ripresa da nessuna copia
  const t = bozzeLocali(); delete t[id]; store.set(K_BOZZE, t);

// cancella la bozza del rapportino aperto (inviato, salvato in officina, ecc.)
const clearDraft = () => { clearTimeout(_bozzaT); clearTimeout(_bozzaS); segnaInviato(S.uid); eliminaBozza(S.uid); };
// rapportini già inviati (o chiusi): una loro bozza rimasta nel registro non va più ripresa
const K_INVIATI = 'rap_inviati';
function segnaInviato(id) {
  if (!id) return; const t = store.get(K_INVIATI) || {}; const ora = Date.now();
  t[id] = ora; Object.keys(t).forEach(k => { if (ora - t[k] > 30 * 86400000) delete t[k]; }); store.set(K_INVIATI, t);
}
const giaInviato = id => !!(store.get(K_INVIATI) || {})[id];
// unisce le bozze salvate nel registro (altro telefono, memoria del telefono svuotata) con quelle locali
function unisciBozzeServer(dati) {
  // nuovo formato {bozze, chiuse}: le chiuse (eliminate o inviate da qualsiasi telefono) spariscono anche da qui
  const lista = Array.isArray(dati) ? dati : (dati && dati.bozze) || [];
  const chiuse = Array.isArray(dati) ? [] : (dati && dati.chiuse) || [];
  const t = bozzeLocali(); let cambiate = false;
  chiuse.forEach(id => { segnaInviato(id); if (t[id] && id !== S.uid) { delete t[id]; cambiate = true; } });
  lista.forEach(b => {
    if (!b || !b.uid) return;
    if (giaInviato(b.uid)) { eliminaBozzaServer(b.uid); return; }          // inviato da questo telefono: la copia nel registro è un avanzo
    if (!t[b.uid] || (b.agg || 0) > (t[b.uid].agg || 0)) { t[b.uid] = b; cambiate = true; }
  });
  if (cambiate) store.set(K_BOZZE, t);
  return cambiate;
}

/* ---------- torrefazioni ---------- */
const altreTorr = () => D.torrefazioni.filter(t => t !== D.segafredo && t !== D.privato);
const torrName = (t, nome) => t === 'Segafredo' ? D.segafredo : t === 'Privato' ? D.privato : t === 'Altre' ? (nome || '') : '';
const torrKind = nome => nome === D.segafredo ? 'Segafredo' : nome === D.privato ? 'Privato' : (nome ? 'Altre' : '');
const torrLabel = (t, nome) => t === 'Segafredo' ? 'Segafredo' : t === 'Privato' ? 'Cliente privato' : t === 'Altre' ? (nome || 'Altra torrefazione') : '';

/* ---------- passi ---------- */
function verificheTipo(s = S) { return (D && D.verifiche[s.oTipo]) || []; }
function steps(s = S) {
  if (s.mode === 'officina') return ['macchina', 'lavoro'].concat(verificheTipo(s).length ? ['verifiche'] : [], ['riepilogo']);
  const st = ['cliente'];
  if (s.torref === 'Segafredo' && s.intervento && s.intervento !== NESSUN) st.push('apparecchi');
  return st.concat(['lavoro', 'chiusura', 'riepilogo']);
}
const locLabel = l => !l ? '' : l.altra ? 'Altra: ' + (l.libera || '(scrivila)') : (l.c ? l.n + ' · ' + l.c : l.n);
const cliSub = c => [c.via, [c.fraz, c.loc].filter(Boolean).join(' – ')].filter(Boolean).join(', ') || 'Indirizzo da completare';
const ph = k => (S.photos[k] && S.photos[k].st) || 'none';
const fotoFatta = k => ['ok', 'skip', 'attesa'].includes(ph(k));

/* ---------- dati mancanti ---------- */
function missingFor(sc, s = S) {
  const m = []; const add = (k, l) => m.push({ k, l }); const ok = k => s.carta || ph(k) === 'ok' || ph(k) === 'skip' || ph(k) === 'attesa';
  if (sc === 'cliente') {
    if (!s.cliente) add('locale', 'locale');
    if (!s.torref || (s.torref === 'Altre' && !s.torrNome)) add('torref', 'torrefazione');
    if (s.torref === 'Segafredo') { if (!s.firmatario.trim()) add('firmatario', 'chi firma'); if (!s.intervento) add('intervento', 'tipo d\'intervento'); }
    if (s.torref === 'Privato') { if (!s.pag) add('pag', 'pagamento'); if (s.pag === 'Contanti' && !String(s.importo || '').trim()) add('importo', 'importo incassato'); if (s.pag === 'Vuole fattura') { const fm = ftMancanti(s.ft, s.fattura); if (fm.length) add('fattura', fm[0]); } }
    if (s.torref === 'Altre' && !s.ditta) add('ditta', 'ditta');
    if (!s.localita || (s.localita.altra && !String(s.localita.libera || '').trim())) add('localita', 'località');
  }
  if (sc === 'apparecchi') {
    const inst = s.intervento === 'Installazione';
    APPS.forEach(a => {
      const x = s.apps[a.k], n = a.n.toLowerCase();
      if (x.on === null) add('app_' + a.k, n + ' (sì o no)');
      else if (x.on && s.intervento === RITIRO) {
        if (!x.rMatricola.trim()) add('rmat_' + a.k, 'matricola ritirato ' + n);
        if (!ok('rit_' + a.k)) add('rfoto_' + a.k, 'foto targhetta ritirato ' + n);
      }
      else if (x.on) {
        if (!x.matricola.trim()) add('mat_' + a.k, 'matricola ' + n);
        if (inst && !ok('app_' + a.k)) add('foto_' + a.k, 'foto targhetta ' + n);   // foto obbligatoria solo con installazione/ritiro (0.11)
        if (inst && !x.rNone && !x.rMatricola.trim()) add('rmat_' + a.k, 'matricola ritirato ' + n);
        if (inst && !x.rNone && !ok('rit_' + a.k)) add('rfoto_' + a.k, 'foto targhetta ritirato ' + n);
      }
    });
  }

  if (sc === 'chiusura') {
    if (!s.ricevuto.trim()) add('ricevuto', 'chi ha ricevuto');
    if (!s.carta && (s.timbro === 'foto' ? !ok('timbro') : !s.firma)) add('timbro', s.timbro === 'foto' ? 'foto del timbro' : 'firma');
  }
  if (sc === 'macchina') {
    if (!s.oTorref || (s.oTorref === 'Altre' && !s.oTorrNome)) add('oTorref', 'torrefazione');
    if (s.oTorref && s.oTorref !== 'Segafredo' && !s.oDitta) add('oDitta', 'ditta');
    if (s.oTorref === 'Privato') { if (!s.oPag) add('oPag', 'pagamento'); if (s.oPag === 'Contanti' && !String(s.oImporto || '').trim()) add('importo', 'importo incassato'); if (s.oPag === 'Vuole fattura') { const fm = ftMancanti(s.oft, s.oFattura); if (fm.length) add('oFattura', fm[0]); } }
    if (!s.oTipo) add('oTipo', 'tipo di macchinario');
    if (!s.oMarca.trim()) add('oMarca', 'marca e modello');
    if (!s.oMatricola.trim()) add('oMatricola', 'matricola');
  }
  if (sc === 'verifiche') { const ch = verificheTipo(s); if (ch.filter((_, i) => s.checks[s.oTipo + '|' + i]).length < ch.length) add('checks', 'verifiche'); }

}

function pRicForn() {

function pRic() {
  const R = UI.rr || {};
  if (senzaRete() && !R.dati) return '<div class="info">Senza connessione la ricerca non funziona: il listino è nel registro.</div>';
  if (R.err) return `<div class="warn">${esc(R.err)}</div>`;

  if (!d.ris.length) return h + '<div class="empty">Nessun ricambio trovato. Prova con meno parole o un pezzo di parola.</div>';
  const nl = d.ris.filter(x => !x.ab).length;

}
let _ricT = null, _ricSeq = 0;

  const R = UI.rr; clearTimeout(_ricT);

function cartRisultato(c) {
  const T = CARTUCCE[c.marca]; if (!T || c.mod == null || !c.ml || !c.gocce) return null;

  const min = chiavi[0], max = chiavi[chiavi.length - 1];
  const r = Math.min(Math.max(gradi, min), max);
  const riga = T.righe[String(r)];
  const fuori = gradi < min ? `Sotto i ${min} gradi la tabella non scende: valori di ${min} gradi.` :
    gradi > max ? (c.marca === 'BWT' ? 'Oltre 30 gradi: valori dell\'ultima riga (>30).' : `Oltre i ${max} gradi la tabella finisce: valori di ${max} gradi, controlla bene.`) : '';

}

    <button class="btn2" data-a="foto" data-v="${key}">Rifai</button></div>`;

// Dati per la fattura a campi separati (25/11). Nel registro va sempre un testo unico (S.fattura / S.oFattura), composto qui.
// «Non ha i dati: li chiede l'ufficio» lascia vuoti i dati fiscali ma chiede nome e telefono, così l'ufficio può richiamare.
function idFiscale(v) {
  const c = String(v || '').replace(/[\s.\-]/g, '').toUpperCase().replace(/^IT(?=\d{11}$)/, '');
  if (!c) return { tipo: '' };
  if (/^\d{11}$/.test(c)) {
    let t = 0; for (let i = 0; i < 11; i++) { let d = +c[i]; if (i % 2) { d *= 2; if (d > 9) d -= 9; } t += d; }
    return { tipo: 'piva', ok: t % 10 === 0 };
  }
  if (/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(c)) return { tipo: 'cf', ok: true };
  return { tipo: 'no' };
}
function componiFattura(f) {
  if (!f) return '';
  const r = [];
  if (f.uff) r.push('DA COMPLETARE IN UFFICIO: il cliente non aveva i dati');
  if (f.nome.trim()) r.push('Nome: ' + f.nome.trim());
  if (!f.uff && f.id.trim()) r.push('P.IVA o C.F.: ' + f.id.trim().toUpperCase());
  if (!f.uff && f.ind.trim()) r.push('Indirizzo: ' + f.ind.trim());
  if (!f.uff && f.sdi.trim()) r.push('SDI o PEC: ' + f.sdi.trim());
  if (f.tel.trim()) r.push('Tel: ' + f.tel.trim());
  return r.join('\n');
}
function ftMancanti(f, testo) {
  if (!f || (!f.uff && !f.nome && !f.id && !f.ind && !f.sdi && !f.tel)) return String(testo || '').trim() ? [] : ['dati per la fattura'];
  const m = [];
  if (!f.nome.trim()) m.push(f.uff ? 'nome del cliente' : 'nome o ragione sociale');
  if (f.uff) { if (!f.tel.trim()) m.push('telefono del cliente'); return m; }
  const id = idFiscale(f.id);
  if (id.tipo !== 'piva' && id.tipo !== 'cf') m.push('P.IVA o codice fiscale');
  if (!f.ind.trim()) m.push('indirizzo');
  return m;
}
function aggiornaFattura() {
  S.fattura = componiFattura(S.ft); S.oFattura = componiFattura(S.oft);
  ['ft', 'oft'].forEach(k => { const el = document.getElementById('p-' + k + 'Id'); if (el) el.innerHTML = msgId(S[k].id); });
}
function msgId(v) {
  const x = idFiscale(v);
  if (!x.tipo) return '<div class="hint">P.IVA: 11 cifre. Codice fiscale: 16 caratteri.</div>';
  if (x.tipo === 'no') return '<div class="msg-err">Non sembra né una partita IVA (11 cifre) né un codice fiscale (16 caratteri)</div>';
  if (x.tipo === 'piva' && !x.ok) return '<div class="hint" style="color:#b45309;font-weight:700">Partita IVA di 11 cifre, ma una cifra sembra sbagliata: ricontrollala</div>';
  return `<div class="msg-ok">${x.tipo === 'piva' ? 'Partita IVA corretta' : 'Codice fiscale corretto'}</div>`;
}
function vDatiFattura(k, testo) {
  const f = S[k] || (S[k] = ftVuoto());
  // bozza delle versioni precedenti (testo libero): il testo va nel nome, da sistemare
  if (testo && !f.nome && !f.id && !f.ind && !f.sdi && !f.tel && !f.uff && !testo.startsWith('Nome: ')) { f.nome = testo; }
  const campo = (c, label, extra = '') => `<div style="margin-top:10px"><div class="lbl" style="font-size:16px;margin-bottom:6px">${label}</div>
    <input class="inp" value="${esc(f[c])}" data-b="${k}.${c}" autocomplete="off" ${extra}></div>`;
  // il pulsante «non ha i dati» sta in fondo e in piccolo: prima si prova a chiederli (col codice Segafredo, se è comodo, lo si salta)
  const btnUff = `<button class="big-btn sec2" data-a="ft-uff" data-v="${k}" style="margin-top:12px;min-height:52px;font-size:18px">${f.uff ? 'Ha i dati: li scrivo' : 'Non ha i dati: li chiede l\'ufficio'}</button>`;
  if (f.uff) return `<div class="lbl">Dati per la fattura</div><div><div class="info">Il cliente non ha i dati: scrivi almeno il nome e il telefono, l'ufficio lo richiama.</div>`
    + campo('nome', 'Nome o ragione sociale') + campo('tel', 'Telefono del cliente', 'type="tel" inputmode="tel"') + btnUff + '</div>';
  return `<div class="lbl">Dati per la fattura</div><div>` + campo('nome', 'Nome o ragione sociale')
    + `<div style="margin-top:10px"><div class="lbl" style="font-size:16px;margin-bottom:6px">Partita IVA o codice fiscale</div>
      <input class="inp mono" value="${esc(f.id)}" data-b="${k}.id" autocomplete="off"><div id="p-${k}Id">${msgId(f.id)}</div></div>`
    + campo('ind', 'Indirizzo <span>(via, numero, CAP, comune)</span>')
    + campo('sdi', 'Codice SDI o PEC <span>(se lo sa)</span>', 'autocapitalize="characters"')
    + campo('tel', 'Telefono <span>(facoltativo, utile all\'ufficio)</span>', 'type="tel" inputmode="tel"') + btnUff + '</div>';
}

// Dati per la fattura: controllo leggero (non blocca). Scrivere "verifica in ufficio" sembra compilato ma non lo è:
// servono partita IVA o codice fiscale e, con la partita IVA, codice SDI o PEC. Stesso controllo del backoffice.
function fatturaKo(t) {
  t = String(t || '').trim();
  if (!t) return '';
  const piva = /(^|[^0-9])(IT\s?)?\d{11}(?![0-9])/i.test(t), cf = /[A-Z]{6}\s?\d{2}\s?[A-Z]\s?\d{2}\s?[A-Z]\s?\d{3}\s?[A-Z]/i.test(t);
  if (!piva && !cf) return 'Manca la partita IVA o il codice fiscale';
  if (piva && !cf && !/@/.test(t) && !/SDI\W*[A-Z0-9]{7}\b/i.test(t) && !/\b(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-Z])[A-Z0-9]{7}\b/.test(t) && !/\b0000000\b/.test(t)) return 'Manca il codice SDI o la PEC';
  return '';
}
const msgFattura = t => { const ko = fatturaKo(t); return !String(t || '').trim() ? '' : ko
  ? `<div class="hint" style="color:#b45309;font-weight:700">${ko}: chiedilo al cliente. Se non ce l'ha, scrivi il suo numero di telefono: l'ufficio lo richiamerà.</div>`
  : '<div class="msg-ok">Dati per la fattura completi</div>'; };
function vPagamento(bad, pre, pag, importo, fattura) {
  return `${blk(bad, pre ? 'oPag' : 'pag', `<div class="lbl">Pagamento</div><div class="grid2">${['Contanti', 'Vuole fattura'].map(l => opt(pag === l, pre ? 'opag' : 'pag', l, l)).join('')}</div>`)}
    ${blk(bad, 'importo', `<div class="lbl">Importo incassato ${pag === 'Vuole fattura' ? '<span>(se ha pagato)</span>' : ''}</div><div class="prefix eur"><span>€</span>
      <input class="inp" type="text" inputmode="decimal" value="${esc(importo)}" data-b="${pre ? 'oImporto' : 'importo'}" data-f="importo"></div>`)}
    ${pag === 'Vuole fattura' ? blk(bad, pre ? 'oFattura' : 'fattura', vDatiFattura(pre ? 'oft' : 'ft', fattura)) : ''}`;
}

      let v = (x.modello || '—') + '\nmatr. ' + (x.matricola ? x.matricola.toUpperCase() : 'mancante') + (x.data ? ' · ' + fmtMonth(x.data) : '') + '\nfoto ' + (phs('app_' + a.k) || (inst ? 'mancante' : 'non fatta (facoltativa)'));
      if (inst && !x.rNone) { v += '\nRitirato: ' + (x.rModello || '—') + ' · matr. ' + (x.rMatricola ? x.rMatricola.toUpperCase() : 'mancante') + ' · foto ' + (phs('rit_' + a.k) || 'mancante'); if (!x.rMatricola.trim() || (!S.carta && !fotoFatta('rit_' + a.k))) miss = true; }
      if (inst && x.rNone) v += '\nNessuno ritirato';
      return { k: a.n, v, cls: miss ? 'miss' : '', miss };
    }));
  }
  sec('Lavoro e pezzi', 'lavoro', lav);
  const tb = (S.timbro === 'foto' ? (phs('timbro') ? 'Foto ' + phs('timbro') : '') : (S.firma ? 'Firma raccolta' : '')) || (S.carta ? 'Sul bollettino di carta' : '');
  sec('Ricevuta e timbro', 'chiusura', [R('Ha ricevuto', S.ricevuto.trim()), R('Note per l\'ufficio', S.note.trim(), false), R(S.timbro === 'foto' ? 'Timbro' : 'Firma', tb)]);
  return out;
}
function vRiepilogo() {
  const secs = sezioni(); const missing = [];
  secs.forEach(x => x.rows.forEach(r => { if (r.miss) missing.push(r.k.toLowerCase()); }));
  const inCarico = Object.values(S.photos).some(p => p && p.st === 'up');
  let h = `<div class="pad" style="gap:20px;padding-top:20px">`;
  if (missing.length) h += `<div class="warn">Prima di inviare completa: ${esc(missing.join(', '))}.</div>`;
  else if (inCarico) h += `<div class="info">Aspetta che le foto finiscano di caricarsi.</div>`;
  else h += `<div style="font-size:17px;color:var(--color-neutral-800)">Tutto compilato. Controlla e tocca «Modifica» se serve correggere.</div>`;
  secs.forEach(sec => {
    const ex = !!S.expanded[sec.title];
    const okRows = sec.rows.filter(r => !r.miss && r.v !== '—' && r.v !== 'No' && r.v !== 'Nessuno');
    const shown = ex ? sec.rows : sec.rows.filter(r => r.miss);
    h += `<div class="sec blueprint">${CORNERS}<div class="sec-h"><div>${esc(sec.title)}</div>
      <button class="btn2 acc" data-a="modifica" data-v="${sec.screen}" style="display:flex;gap:6px;align-items:center;min-height:44px">${SVG.pen}Modifica</button></div>
      ${ex ? '' : `<div class="sec-sum">${esc(okRows.slice(0, 4).map(r => sec.title === 'Apparecchi' ? r.k : r.v.split('\n')[0]).join(' · ') || '—')}</div>`}
      <div class="sec-rows">${shown.map(r => `<div class="sec-row"><div class="k">${esc(r.k)}</div><div class="v ${r.cls}">${esc(r.v)}</div></div>`).join('')}</div>
      <button class="sec-tg" data-a="espandi" data-v="${esc(sec.title)}">${ex ? 'Mostra meno' : 'Mostra tutto (' + sec.rows.length + ')'}</button></div>`;
  });
  return h + `</div>`;
}

/* ---------- Conferma ---------- */
function vConferma() {
  const e = S.esito || {}; const isOff = S.mode === 'officina';
  const foto = Object.values(S.photos).filter(p => p && p.st === 'ok').length + (S.timbro === 'firma' && S.firma && !isOff ? 1 : 0);
  const testo = isOff ? `${S.oTipo} ${S.oMarca}, matricola ${S.oMatricola.toUpperCase()}.` : `${S.cliente ? S.cliente.nome : ''}, ${locLabel(S.localita)}.`;

    <div><h2 class="big" style="margin:0 0 8px">Rapportino inviato</h2><p style="font-size:18px;color:var(--color-neutral-800);margin:0">${esc(testo)}</p></div>
    <div class="conf-rows"><div><span>Numero</span><b>N. ${esc(e.n || '—')}</b></div><div><span>Inviato</span><b>oggi alle ${esc(e.ora || '')}</b></div>
      <div><span>Foto e firme</span><b>${foto}</b></div><div><span>Tecnico</span><b>${esc(AUTH.tecnico)}</b></div></div>

/* ---------- Pulsante in basso ---------- */
function vFooter(sc, warn) {
  let label = S.fromSummary ? 'Torna al riepilogo' : 'Avanti', dis = false, a = 'avanti', manca = false, vai = '';
  const mm = ['riepilogo', 'verifiche'].includes(sc) ? [] : missingFor(sc);
  if (mm.length) { manca = true; a = 'vai-mancante'; label = 'Manca: ' + mm[0].l + (mm.length > 1 ? ` (+${mm.length - 1})` : ''); vai = S.fromSummary ? 'Torna al riepilogo lo stesso' : 'Vai avanti lo stesso (lo completi dopo)'; }
  if (sc === 'verifiche' && !S.fromSummary) { const ch = verificheTipo(), nm = verificheMancanti().length; if (nm) label = `Avanti (${ch.length - nm} di ${ch.length} spuntate)`; }
  if (sc === 'riepilogo') {
    const missing = []; sezioni().forEach(x => x.rows.forEach(r => { if (r.miss) missing.push(r.k); }));
    const inCarico = Object.values(S.photos).some(p => p && p.st === 'up');
    a = 'invia';
    if (missing.length) { dis = true; label = missing.length === 1 ? 'Manca 1 dato' : `Mancano ${missing.length} dati`; }
    else if (inCarico) { dis = true; label = 'Foto in caricamento…'; }
    else label = 'Invia all\'ufficio';
  }
  return `<div class="ftr"><button class="big-btn blueprint ${dis ? 'dis' : ''} ${manca ? 'manca' : ''}" ${dis ? '' : `data-a="${a}"`}>${CORNERS}${esc(label)}</button>
    ${vai ? `<button class="vai" data-a="avanti-forza">${vai}</button>` : ''}</div>`;
}

let fotoKey = null;

const nomeFoto = k => (S.mode === 'officina' ? (S.oMatricola || 'officina') : (S.cliente ? S.cliente.nome : 'cliente')) + ' ' + k;
async function caricaFoto(k, file) {
  S.photos[k] = { st: 'up' }; render();
  let thumb = '', full = '';
  try {
    ({ full, thumb } = await riduci(file));
    S.photos[k] = { st: 'up', thumb }; render();
    const r = await run('appCaricaFoto', AUTH.pin, full, nomeFoto(k));
    S.photos[k] = { st: 'ok', thumb, url: r.url, id: r.id };
  } catch (err) {
    // senza connessione la foto resta sul telefono e si carica dopo (prima dell'invio o quando torna la rete)
    if (full && errMsg(err) !== 'CODICE_ERRATO' && await IDB.set('foto|' + S.uid + '|' + k, full)) {
      S.photos[k] = { st: 'attesa', thumb };
      alertBreve('Senza connessione: foto salvata sul telefono, si carica quando prende.');
    } else {
      S.photos[k] = Object.assign({}, S.photos[k], { st: 'err' });
      alertBreve('Foto non caricata: ' + errMsg(err));
    }

}
// carica le foto rimaste sul telefono; ritorna quante non è riuscito a caricare
let _caricoAttesa = null;
function caricaFotoInAttesa() {
  if (_caricoAttesa) return _caricoAttesa;
  _caricoAttesa = (async () => {
    const uidOra = S.uid; let rimaste = 0;
    for (const k of Object.keys(S.photos || {})) {
      const p = S.photos[k]; if (!p || p.st !== 'attesa') continue;
      const full = await IDB.get('foto|' + uidOra + '|' + k);
      if (!full) { S.photos[k] = { st: 'err', thumb: p.thumb }; rimaste++; continue; }
      try {
        const r = await run('appCaricaFoto', AUTH.pin, full, nomeFoto(k));
        if (S.uid !== uidOra) break;
        S.photos[k] = { st: 'ok', thumb: p.thumb, url: r.url, id: r.id };
        IDB.del('foto|' + uidOra + '|' + k);
        salvaBozza();
      } catch (e) { rimaste++; }
    }
    return rimaste;
  })().finally(() => { _caricoAttesa = null; });
  return _caricoAttesa;
}

/* ---------- fotocamera dentro l'app (per i telefoni che chiudono la pagina quando si apre la fotocamera) ---------- */
const K_CAM = 'rap_cam_interna';
// 26/11: la fotocamera dell'app è quella normale per tutti (con l'app Fotocamera di Android alcuni telefoni danno
// "memoria insufficiente"). Chi vuole la fotocamera del telefono la sceglie col link sotto il pulsante (resta ricordato).
const camInterna = () => { const v = store.get(K_CAM); return v === null ? true : !!v; };
const camPossibile = () => !DENTRO_GOOGLE && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false;
let _cam = null;
async function apriCamera(k) {
  chiudiCamera();
  const box = document.createElement('div'); box.className = 'cam-full';
  box.innerHTML = `<video playsinline autoplay muted></video><div class="cam-msg">Apro la fotocamera…</div>
    <div class="cam-b"><button class="big-btn sec2" data-cam="chiudi">Annulla</button><button class="cam-scatta" data-cam="scatta" aria-label="Scatta la foto"></button><span></span></div>`;
  box.addEventListener('click', e => { const b = e.target.closest('[data-cam]'); if (!b) return; e.preventDefault(); e.stopPropagation(); if (b.dataset.cam === 'scatta') scatta(); else chiudiCamera(); });
  document.body.appendChild(box);
  _cam = { box, k, stream: null };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } } });
    if (!_cam || _cam.box !== box) { stream.getTracks().forEach(t => t.stop()); return; }
    _cam.stream = stream;
    const v = box.querySelector('video'); v.srcObject = stream;
    try { await v.play(); } catch (e) { }
    box.querySelector('.cam-msg').textContent = '';
  } catch (e) {
    chiudiCamera();
    alertBreve(e && e.name === 'NotAllowedError' ? 'Fotocamera non permessa: in Chrome tocca il lucchetto accanto all\'indirizzo → Autorizzazioni → Fotocamera → Consenti. Intanto usa «Scegli dalla galleria».'
      : 'Fotocamera dell\'app non disponibile su questo telefono: d\'ora in poi si apre quella del telefono. Puoi anche usare «Scegli dalla galleria».');
    if (!(e && e.name === 'NotAllowedError')) { store.set(K_CAM, false); render(); }
  }
}
function chiudiCamera() {
  const c = _cam; _cam = null; if (!c) return;
  if (c.stream) c.stream.getTracks().forEach(t => t.stop());
  const v = c.box.querySelector('video'); if (v) v.srcObject = null;
  c.box.remove();
}
function scatta() {
  const c = _cam; if (!c || !c.stream) return;
  const v = c.box.querySelector('video'); const w = v.videoWidth, h = v.videoHeight; if (!w || !h) return;
  const r = Math.min(1, 1400 / Math.max(w, h));
  const cv = document.createElement('canvas'); cv.width = Math.round(w * r); cv.height = Math.round(h * r);
  cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
  const k = c.k; chiudiCamera();
  cv.toBlob(b => { cv.width = cv.height = 0; if (b) caricaFoto(k, b); else alertBreve('Foto non riuscita: riprova.'); }, 'image/jpeg', 0.85);
}

/* ---------- senza connessione: dati salvati sul telefono (IndexedDB, più spazio della memoria normale) ---------- */
const IDB = (() => {
  let p = null;
  const db = () => p || (p = new Promise((ok, ko) => { const r = indexedDB.open('rapportini', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }));
  const tx = (modo, f) => db().then(d => new Promise((ok, ko) => { const t = d.transaction('kv', modo); const q = f(t.objectStore('kv')); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); }));
  return {
    get: k => tx('readonly', s => s.get(k)).catch(() => null),
    set: (k, v) => tx('readwrite', s => s.put(v, k)).then(() => true).catch(() => false),
    del: k => tx('readwrite', s => s.delete(k)).catch(() => { })
  };
})();

function noteConFotoMancanti() {

    const a = APPS.find(x => 'app_' + x.k === k || 'rit_' + x.k === k);

function riduci(file) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const out = max => { const r = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c; };
      const cf = out(1400), full = cf.toDataURL('image/jpeg', 0.72); cf.width = cf.height = 0;   // libero subito la memoria
      const ct = out(160), thumb = ct.toDataURL('image/jpeg', 0.6); ct.width = ct.height = 0;
      URL.revokeObjectURL(url); img.src = ''; ok({ full, thumb });
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('immagine non leggibile')); };
    img.src = url;
  });
}
function alertBreve(t) {
  const d = document.createElement('div'); d.className = 'warn'; d.textContent = t;
  Object.assign(d.style, { position: 'absolute', left: '16px', right: '16px', top: '16px', zIndex: 9 });

    <div class="sig"><canvas id="firma"></canvas><div class="line"></div><div class="t">Firma con il dito sopra la riga</div></div>
    <div class="ff-b"><button class="big-btn sec2" data-a="firma-pulisci">Cancella</button><button class="big-btn" data-a="firma-fatto">Fatto</button></div></div>`;

let _firmaRes = null;

function initFirma() {
  const el = document.getElementById('firma'); if (!el) return;
  const r0 = el.getBoundingClientRect(); const dpr = 2;
  el.width = r0.width * dpr; el.height = r0.height * dpr;
  const ctx = el.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1f20';
  if (S.firma) { const im = new Image(); im.onload = () => { const k = Math.min(r0.width / im.width, r0.height / im.height); const w = im.width * k, hh = im.height * k; ctx.drawImage(im, (r0.width - w) / 2, (r0.height - hh) / 2, w, hh); }; im.src = S.firma; }
  let down = false, mosso = false;
  const pos = e => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  el.addEventListener('pointerdown', e => { down = true; mosso = false; el.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); });
  el.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); mosso = true; });
  const up = () => {
    if (!down) return; down = false;
    if (mosso) {
      // firma su sfondo bianco, ridotta: si salva nella bozza e si carica all'invio
      const c = document.createElement('canvas'); c.width = 900; c.height = Math.round(900 * el.height / el.width);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(el, 0, 0, c.width, c.height);
      S.firma = c.toDataURL('image/jpeg', 0.8); salvaBozza();

    }
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}

    if (isOff) Object.assign(r, {

    });
    else Object.assign(r, {

    clearDraft();
    UI.sending = false;
    S.esito = es; S.screen = 'conferma'; S.savedAt = '';
    render();
    run('appDati', AUTH.pin).then(d => { D = d; UI.offline = false; IDB.set('dati', d); }).catch(() => { });   // aggiorna clienti e pezzi in sottofondo
  } catch (e) {
    UI.sending = false; render();
    if (errMsg(e) === 'CODICE_ERRATO') { store.del(K_AUTH); AUTH = null; UI.phase = 'pin'; UI.err = 'Il codice d\'accesso è cambiato: inseriscilo di nuovo. Il rapportino resta salvato.'; render(); return; }
    alertBreve(navigator.onLine === false || /connessione|non risponde/i.test(errMsg(e))
      ? 'Senza connessione: il rapportino è salvato sul telefono (lo trovi in «Rapportini non inviati»). Invialo quando prende.'
      : 'Invio non riuscito: ' + errMsg(e) + '. Il rapportino è salvato, riprova.');
  }
}

/* ---------- avvio ---------- */
function avvia() {
  if (!AUTH || !AUTH.pin) { UI.phase = 'pin'; return render(); }
  if (!AUTH.tecnico) {
    UI.phase = 'avvio'; render();
    // con la chiave personale il nome lo sa il registro: "Chi sei?" solo per il tablet di officina
    return run('appChiSono', AUTH.pin).then(nome => {
      if (nome && !AUTH.tablet) { AUTH.tecnico = nome; store.set(K_AUTH, AUTH); return avvia(); }
      return run('appAccedi', AUTH.pin).then(r => { AUTH.tablet = !!r.tablet; store.set(K_AUTH, AUTH); UI.tecnici = r.tecnici || []; UI.phase = 'chi'; render(); });
    }).catch(e => falli(e));
  }
  UI.phase = 'avvio'; render();
  const pronto = (d, offline) => {
    D = d; UI.offline = !!offline; UI.phase = 'pronto';
    if (!S.mode) { S.data = D.oggi; S.drafts = elencoBozze(); }
    render();
    const ripresa = riprendiDopoFoto();
    if (offline) return;
    run('appLeggiBozze2', AUTH.pin, AUTH.tecnico)
      .then(l => { const n = unisciBozzeServer(l); if (!ripresa && riprendiDopoFoto()) return; if (n && !S.mode) { S.drafts = elencoBozze(); render(); } }).catch(() => { });
  };
  IDB.get('dati').then(cache => {
    let fatto = false;
    // dati dell'ultima volta (senza connessione): la data è quella del telefono
    const usaCache = () => { if (fatto) return; fatto = true; pronto(Object.assign({}, cache, { oggi: oggiTelefono() }), true); };
    const rete = run('appDati', AUTH.pin);
    // con poco segnale non aspetto 90 secondi: dopo 12 secondi apro con i dati salvati
    const tmo = cache ? setTimeout(usaCache, 12000) : null;
    rete.then(d => {
      clearTimeout(tmo); IDB.set('dati', d);
      if (!fatto) { fatto = true; pronto(d, false); }
      else { D = d; UI.offline = false; if (!UI.firma && !_cam) render(); }   // arrivati dopo: aggiorno in silenzio
    }).catch(e => {
      clearTimeout(tmo);
      if (fatto) return;
      if (cache && erroreRete(e)) usaCache(); else falli(e);
    });
  });
}
// Tablet di officina: torna alla scelta del nome (dopo un invio, un "Interrompi e salva", o quando si riaccende lo schermo)
function tornaAChi(sempre) {
  if (!AUTH || (!AUTH.tablet && !sempre)) return false;
  AUTH.tecnico = ''; store.set(K_AUTH, AUTH);
  S = Object.assign(initState(), { data: oggi() });
  avvia();
  return true;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && AUTH && AUTH.tablet && AUTH.tecnico && UI.phase === 'pronto' && (!S.mode || S.screen === 'inizio')) tornaAChi();
});
function falli(e) {
  if (errMsg(e) === 'CODICE_ERRATO') { store.del(K_AUTH); AUTH = null; UI.phase = 'pin'; UI.err = 'Codice d\'accesso non valido.'; }
  else { UI.phase = 'errore'; UI.err = errMsg(e); }
  render();
}
// Link personale (…/exec?t=CHIAVE): entra senza codice e sa già chi sei. Serve perché sull'icona
// della schermata Home il telefono spesso non conserva il codice tra un'apertura e l'altra.
function partenza() {
  if (!DENTRO_GOOGLE) { const t = new URLSearchParams(location.search).get('t') || ''; return entraConChiave(t); }
  if (!google.script.url) return avvia();
  google.script.url.getLocation(loc => entraConChiave((loc && loc.parameter && loc.parameter.t) || ''));
}
function entraConChiave(t) {
  {
    if (AUTH && AUTH.pin === t && AUTH.tablet) { AUTH.tecnico = ''; store.set(K_AUTH, AUTH); return avvia(); }   // tablet: ogni volta chi sei
    if (!t || (AUTH && AUTH.pin === t && AUTH.tecnico)) return avvia();
    UI.phase = 'avvio'; render();
    run('appChiSono', t).then(nome => { AUTH = { pin: t, tecnico: nome || '', tablet: false }; store.set(K_AUTH, AUTH); avvia(); })
      .catch(e => falli(e));
  }
}
partenza();
// Pagina su GitHub: salvata nel telefono (sw.js) così si apre anche senza connessione
if (!DENTRO_GOOGLE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}
</script>
</body>
